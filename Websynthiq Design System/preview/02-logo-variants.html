<!doctype html>
<!-- @dsCard group="Brand" name="Logo — variants" subtitle="Mark, wordmark, on dark" viewport="700x170" --><html><head><meta charset="utf-8"><title>Logo variants</title><link rel="stylesheet" href="_card.css"></head>
<body class="card">
<div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap:12px;">
  <div style="background:#fff; border:1px solid var(--border-1); border-radius:var(--radius-lg); padding:12px; display:flex; flex-direction:column; gap:8px; align-items:center; justify-content:center; min-height:130px;">
    <img src="../assets/favicon.png" alt="" style="height:64px;">
    <div class="label">Mark</div>
  </div>
  <div style="background:#fff; border:1px solid var(--border-1); border-radius:var(--radius-lg); padding:12px; display:flex; flex-direction:column; gap:8px; align-items:center; justify-content:center; min-height:130px;">
    <img src="../assets/wordmark.png" alt="" style="max-width:100%; max-height:48px;">
    <div class="label">Wordmark</div>
  </div>
  <div style="background:var(--gray-900); border-radius:var(--radius-lg); padding:12px; display:flex; flex-direction:column; gap:8px; align-items:center; justify-content:center; min-height:130px;">
    <img src="../assets/favicon.png" alt="" style="height:64px;">
    <div class="label" style="color:var(--gray-300);">On dark</div>
  </div>
</div>
</body></html>
