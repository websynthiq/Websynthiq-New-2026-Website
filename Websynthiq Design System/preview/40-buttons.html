<!doctype html>
<!-- @dsCard group="Components" name="Buttons" subtitle="Primary, secondary, ghost, sizes" viewport="700x180" --><html><head><meta charset="utf-8"><title>Buttons</title><link rel="stylesheet" href="_card.css"></head>
<body class="card">
<div class="label">Buttons</div>
<div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
  <button style="font-family:var(--font-body); font-weight:600; font-size:14px; background:#2541B2; color:#fff; border:0; padding:10px 18px; border-radius:6px; cursor:pointer; box-shadow:0 1px 2px rgba(13,24,60,0.08);">Primary</button>
  <button style="font-family:var(--font-body); font-weight:600; font-size:14px; background:#1F37A0; color:#fff; border:0; padding:10px 18px; border-radius:6px;">Hover</button>
  <button style="font-family:var(--font-body); font-weight:600; font-size:14px; background:#182B82; color:#fff; border:0; padding:10px 18px; border-radius:6px; box-shadow:inset 0 2px 4px rgba(0,0,0,0.15);">Pressed</button>
  <button style="font-family:var(--font-body); font-weight:600; font-size:14px; background:#fff; color:#2541B2; border:1px solid #DCE0E9; padding:10px 18px; border-radius:6px; cursor:pointer;">Secondary</button>
  <button style="font-family:var(--font-body); font-weight:600; font-size:14px; background:transparent; color:#2541B2; border:0; padding:10px 18px; border-radius:6px; cursor:pointer;">Ghost</button>
  <button style="font-family:var(--font-body); font-weight:600; font-size:14px; background:#000; color:#fff; border:0; padding:10px 18px; border-radius:6px;">Ink</button>
  <button disabled style="font-family:var(--font-body); font-weight:600; font-size:14px; background:#EEF0F5; color:#8A93A6; border:0; padding:10px 18px; border-radius:6px;">Disabled</button>
</div>
<div style="display:flex; gap:10px; align-items:center; margin-top:4px;">
  <button style="font-family:var(--font-body); font-weight:600; font-size:12px; background:#2541B2; color:#fff; border:0; padding:6px 12px; border-radius:4px;">Small</button>
  <button style="font-family:var(--font-body); font-weight:600; font-size:14px; background:#2541B2; color:#fff; border:0; padding:10px 18px; border-radius:6px;">Default</button>
  <button style="font-family:var(--font-body); font-weight:600; font-size:16px; background:#2541B2; color:#fff; border:0; padding:14px 24px; border-radius:8px;">Large</button>
  <button style="font-family:var(--font-body); font-weight:600; font-size:14px; background:#2541B2; color:#fff; border:0; padding:10px 18px; border-radius:999px;">Pill</button>
</div>
</body></html>
