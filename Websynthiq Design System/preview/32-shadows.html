<!doctype html>
<!-- @dsCard group="Spacing" name="Shadows" subtitle="Cool-tinted elevation ramp" viewport="700x150" --><html><head><meta charset="utf-8"><title>Shadows</title><link rel="stylesheet" href="_card.css"></head>
<body class="card">
<div class="label">Elevation · cool-tinted</div>
<div style="display:grid; grid-template-columns: repeat(5, 1fr); gap:14px; padding:14px 4px 22px;">
  <div style="background:#fff; height:72px; border-radius:8px; box-shadow:0 1px 2px rgba(13,24,60,0.06); display:flex; align-items:center; justify-content:center; font-family:var(--font-techno); font-weight:600; color:var(--fg-2);">xs</div>
  <div style="background:#fff; height:72px; border-radius:8px; box-shadow:0 2px 4px rgba(13,24,60,0.06), 0 1px 2px rgba(13,24,60,0.04); display:flex; align-items:center; justify-content:center; font-family:var(--font-techno); font-weight:600; color:var(--fg-2);">sm</div>
  <div style="background:#fff; height:72px; border-radius:8px; box-shadow:0 6px 16px rgba(13,24,60,0.08), 0 2px 4px rgba(13,24,60,0.04); display:flex; align-items:center; justify-content:center; font-family:var(--font-techno); font-weight:600; color:var(--fg-2);">md</div>
  <div style="background:#fff; height:72px; border-radius:8px; box-shadow:0 16px 32px rgba(13,24,60,0.10), 0 4px 8px rgba(13,24,60,0.05); display:flex; align-items:center; justify-content:center; font-family:var(--font-techno); font-weight:600; color:var(--fg-2);">lg</div>
  <div style="background:#fff; height:72px; border-radius:8px; box-shadow:0 24px 48px rgba(13,24,60,0.14), 0 8px 16px rgba(13,24,60,0.06); display:flex; align-items:center; justify-content:center; font-family:var(--font-techno); font-weight:600; color:var(--fg-2);">xl</div>
</div>
</body></html>
