<!doctype html>
<!-- @dsCard group="Spacing" name="Corner radii" subtitle="xs → pill" viewport="700x140" --><html><head><meta charset="utf-8"><title>Radii</title><link rel="stylesheet" href="_card.css"></head>
<body class="card">
<div class="label">Corner radii</div>
<div style="display:grid; grid-template-columns: repeat(7, 1fr); gap:8px;">
  <div style="text-align:center;"><div style="height:64px; background:var(--cobalt-100); border:1px solid var(--cobalt-300); border-radius:2px;"></div><div class="code" style="margin-top:6px;">xs · 2</div></div>
  <div style="text-align:center;"><div style="height:64px; background:var(--cobalt-100); border:1px solid var(--cobalt-300); border-radius:4px;"></div><div class="code" style="margin-top:6px;">sm · 4</div></div>
  <div style="text-align:center;"><div style="height:64px; background:var(--cobalt-100); border:1px solid var(--cobalt-300); border-radius:6px;"></div><div class="code" style="margin-top:6px;">md · 6</div></div>
  <div style="text-align:center;"><div style="height:64px; background:var(--cobalt-100); border:1px solid var(--cobalt-300); border-radius:10px;"></div><div class="code" style="margin-top:6px;">lg · 10</div></div>
  <div style="text-align:center;"><div style="height:64px; background:var(--cobalt-100); border:1px solid var(--cobalt-300); border-radius:16px;"></div><div class="code" style="margin-top:6px;">xl · 16</div></div>
  <div style="text-align:center;"><div style="height:64px; background:var(--cobalt-100); border:1px solid var(--cobalt-300); border-radius:24px;"></div><div class="code" style="margin-top:6px;">2xl · 24</div></div>
  <div style="text-align:center;"><div style="height:64px; background:var(--cobalt-100); border:1px solid var(--cobalt-300); border-radius:999px;"></div><div class="code" style="margin-top:6px;">pill</div></div>
</div>
</body></html>
