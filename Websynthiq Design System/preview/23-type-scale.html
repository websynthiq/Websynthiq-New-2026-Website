<!doctype html>
<!-- @dsCard group="Type" name="Type scale" subtitle="Display → caption" viewport="700x380" --><html><head><meta charset="utf-8"><title>Type scale</title><link rel="stylesheet" href="_card.css"></head>
<body class="card">
<div class="label">Type scale</div>
<div style="display:flex; flex-direction:column; gap:6px;">
  <div style="display:grid; grid-template-columns: 80px 1fr 80px; gap:12px; align-items:baseline;">
    <div class="code">72/h1.disp</div>
    <div style="font-family:var(--font-display); font-weight:800; text-transform:uppercase; font-size:72px; line-height:1; letter-spacing:-0.02em;">WEB</div>
    <div class="code">--fs-72</div>
  </div>
  <div style="display:grid; grid-template-columns: 80px 1fr 80px; gap:12px; align-items:baseline;">
    <div class="code">48/h1</div>
    <div style="font-family:'Orbitron',var(--font-techno); font-weight:700; font-size:48px; line-height:1.05;">Heading 1</div>
    <div class="code">--fs-48</div>
  </div>
  <div style="display:grid; grid-template-columns: 80px 1fr 80px; gap:12px; align-items:baseline;">
    <div class="code">36/h2</div>
    <div style="font-family:'Orbitron',var(--font-techno); font-weight:700; font-size:36px; line-height:1.1;">Heading 2</div>
    <div class="code">--fs-36</div>
  </div>
  <div style="display:grid; grid-template-columns: 80px 1fr 80px; gap:12px; align-items:baseline;">
    <div class="code">24/h3</div>
    <div style="font-family:'Orbitron',var(--font-techno); font-weight:500; font-size:24px;">Heading 3</div>
    <div class="code">--fs-24</div>
  </div>
  <div style="display:grid; grid-template-columns: 80px 1fr 80px; gap:12px; align-items:baseline;">
    <div class="code">20/lede</div>
    <div style="font-family:var(--font-body); font-size:20px;">Lede paragraph</div>
    <div class="code">--fs-20</div>
  </div>
  <div style="display:grid; grid-template-columns: 80px 1fr 80px; gap:12px; align-items:baseline;">
    <div class="code">16/body</div>
    <div style="font-family:var(--font-body); font-size:16px;">Body text</div>
    <div class="code">--fs-16</div>
  </div>
  <div style="display:grid; grid-template-columns: 80px 1fr 80px; gap:12px; align-items:baseline;">
    <div class="code">12/cap</div>
    <div style="font-family:var(--font-body); font-size:12px; color:var(--fg-3);">Caption / micro</div>
    <div class="code">--fs-12</div>
  </div>
</div>
