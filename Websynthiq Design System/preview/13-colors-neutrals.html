<!doctype html>
<!-- @dsCard group="Colors" name="Neutral scale" subtitle="Cool grays with slight blue lean" viewport="700x160" --><html><head><meta charset="utf-8"><title>Neutrals</title><link rel="stylesheet" href="_card.css"></head>

  <div><div style="background:#EEF0F5; height:64px; border-radius:4px;"></div><div class="code" style="margin-top:6px; text-align:center;">100</div></div>

  <div><div style="background:#3F4655; height:64px; border-radius:4px;"></div><div class="code" style="margin-top:6px; text-align:center;">600</div></div>
  <div><div style="background:#272D3A; height:64px; border-radius:4px;"></div><div class="code" style="margin-top:6px; text-align:center;">700</div></div>
  <div><div style="background:#0A0D14; height:64px; border-radius:4px;"></div><div class="code" style="margin-top:6px; text-align:center;">900</div></div>
</div>
</body></html>
