<!doctype html>
<!-- @dsCard group="Colors" name="Brand colors" subtitle="Cobalt, Steel, Ink, Paper" viewport="700x200" --><html><head><meta charset="utf-8"><title>Brand colors</title><link rel="stylesheet" href="_card.css"></head>
<body class="card">
<div style="display:grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap:10px;">
  <div>
    <div style="background:#2541B2; height:90px; border-radius:var(--radius-md);"></div>
    <div style="margin-top:8px; font-family:var(--font-techno); font-weight:600; font-size:14px;">Cobalt</div>
    <div class="code">#2541B2</div>
    <div class="muted" style="margin-top:2px;">Primary</div>
  </div>
  <div>
    <div style="background:#1768AC; height:90px; border-radius:var(--radius-md);"></div>
    <div style="margin-top:8px; font-family:var(--font-techno); font-weight:600; font-size:14px;">Steel</div>
    <div class="code">#1768AC</div>
    <div class="muted" style="margin-top:2px;">Secondary</div>
  </div>
  <div>
    <div style="background:#000; height:90px; border-radius:var(--radius-md);"></div>
    <div style="margin-top:8px; font-family:var(--font-techno); font-weight:600; font-size:14px;">Ink</div>
    <div class="code">#000000</div>
    <div class="muted" style="margin-top:2px;">"synthiq"</div>
  </div>
  <div>
    <div style="background:#fff; height:90px; border:1px solid var(--border-2); border-radius:var(--radius-md);"></div>
    <div style="margin-top:8px; font-family:var(--font-techno); font-weight:600; font-size:14px;">Paper</div>
    <div class="code">#FFFFFF</div>
    <div class="muted" style="margin-top:2px;">Canvas</div>
  </div>
</div>
</body></html>
