<!doctype html>
<!-- @dsCard group="Components" name="Card" subtitle="Default + hover state" viewport="700x210" --><html><head><meta charset="utf-8"><title>Card</title><link rel="stylesheet" href="_card.css"></head>
<body class="card">
<div class="label">Card</div>
<div style="display:grid; grid-template-columns: 1fr 1fr; gap:14px;">
  <div style="background:#fff; border:1px solid #DCE0E9; border-radius:10px; padding:18px; box-shadow:0 2px 4px rgba(13,24,60,0.06), 0 1px 2px rgba(13,24,60,0.04);">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <div style="font-family:var(--font-techno); font-weight:600; font-size:16px;">acme-marketing</div>
      <span style="font-family:var(--font-techno); font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:0.12em; padding:3px 8px; border-radius:999px; background:#EEF1FB; color:#1F37A0;">Live</span>
    </div>
    <div class="code" style="margin-top:6px;">acme.websynthiq.dev</div>
    <div style="display:flex; gap:14px; margin-top:14px; font-family:var(--font-body); font-size:12px; color:var(--fg-3);">
      <div><div style="font-family:var(--font-techno); font-weight:600; font-size:18px; color:var(--fg-1);">182ms</div>p95 TTFB</div>
      <div><div style="font-family:var(--font-techno); font-weight:600; font-size:18px; color:var(--fg-1);">99.99%</div>uptime</div>
    </div>
  </div>
  <div style="background:#fff; border:1px solid #DCE0E9; border-radius:10px; padding:18px; box-shadow:0 6px 16px rgba(13,24,60,0.10), 0 2px 4px rgba(13,24,60,0.04); transform:translateY(-2px);">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <div style="font-family:var(--font-techno); font-weight:600; font-size:16px;">docs-site</div>
      <span style="font-family:var(--font-techno); font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:0.12em; padding:3px 8px; border-radius:999px; background:#EAF2F9; color:#0D4474;">Building</span>
    </div>
    <div class="code" style="margin-top:6px;">docs.acme.dev</div>
    <div class="muted" style="margin-top:14px;">Hover state · shadow-md, border unchanged</div>
  </div>
</div>
</body></html>
